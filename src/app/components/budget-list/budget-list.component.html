<div class="flex flex-wrap items-center justify-between w-full gap-3 mb-4">
  <p class="font-bold text-2xl !m-0">Set a monthly Budget for your Categories</p>
  <div class="flex flex-wrap items-center gap-2">
    <app-amount-sort [value]="sortOrder" (valueChange)="setSort($event)"></app-amount-sort>
    <mat-button-toggle-group class="!border-0 !shadow-lg" aria-label="Budget view"
      hideSingleSelectionIndicator [value]="view" (change)="setView($event.value)">
      <mat-button-toggle class="!border-0" value="cards">Cards</mat-button-toggle>
      <mat-button-toggle class="!border-0" value="list">List</mat-button-toggle>
    </mat-button-toggle-group>
  </div>
</div>

@let categories = orderedCategories;
@let canReorder = sortOrder === 'manual' && categories.length > 1;
<div class="budget-container" [class.budget-list]="view === 'list'" cdkDropList
  [cdkDropListData]="categories" [cdkDropListOrientation]="view === 'cards' ? 'mixed' : 'vertical'"
  (cdkDropListDropped)="dropBudget($event)">
  @for (category of categories; track category.value; let index = $index) {
    <ng-template #budgetItem>
      <button type="button" class="budget-item" (click)="onBudgetClick(category.value)">
        <mat-icon fontSet="material-symbols-outlined">{{ category.icon }}</mat-icon>
        <span class="budget-label">{{ category.label }}</span>
        <span class="budget-indicator">{{ getBudgetValue(category.value) }}</span>
      </button>
    </ng-template>
    <div class="budget-entry" [class.budget-row]="view === 'list'" cdkDrag
      [cdkDragDisabled]="!canReorder"
      [style.--budget-category-color]="colorService.isDarkMode() ? category.colorDark : category.colorLight">
      <button mat-icon-button type="button" class="budget-reorder-handle" cdkDragHandle
        [disabled]="!canReorder" [attr.aria-label]="'Reorder ' + category.label"
        aria-description="Use Up and Down arrow keys to move this budget"
        (keydown.arrowup)="moveBudgetWithKeyboard($event, index, index - 1)"
        (keydown.arrowdown)="moveBudgetWithKeyboard($event, index, index + 1)">
        <mat-icon fontSet="material-symbols-outlined">drag_indicator</mat-icon>
      </button>
      @if (view === 'list') {
        <ng-container [ngTemplateOutlet]="budgetItem"></ng-container>
      } @else {
        <mat-card class="budget-card">
          <ng-container [ngTemplateOutlet]="budgetItem"></ng-container>
        </mat-card>
      }
    </div>
  }
</div>

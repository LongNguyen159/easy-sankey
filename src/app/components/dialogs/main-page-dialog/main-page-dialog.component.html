<div class="dialog-header">
    <h2 mat-dialog-title class="font-bold!">Details for {{ dialogData.monthData.month }}</h2>
    <button mat-icon-button class="app-button-warn" type="button" aria-label="Close month details" [mat-dialog-close]="true" cdkFocusInitial>
        <mat-icon fontSet="material-symbols-outlined">close</mat-icon>
    </button>
</div>
<mat-dialog-content>
    @if (dialogData.categoryId; as categoryId) {
        <p class="mb-4">
            <strong>{{ categoryService.label(categoryId) }}</strong>
            {{ categorySpending | currency: currencyService.getSelectedCurrency() }}
        </p>
    }
    <app-main-page-single-month [chartData]="dialogData.monthData" [highlightedCategoryId]="dialogData.categoryId"></app-main-page-single-month>
</mat-dialog-content>

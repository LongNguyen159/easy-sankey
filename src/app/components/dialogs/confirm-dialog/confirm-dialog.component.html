<h1 mat-dialog-title data-sensitive-data>{{ data.title }}</h1>
<div mat-dialog-content data-sensitive-data [innerHTML]="data.message">
</div>
<mat-dialog-actions align="end">
    @if(data.cancelLabel) {
        <button mat-stroked-button (click)="onCancel()"> {{ data.cancelLabel }} </button>
    }

    <button mat-flat-button [class]="'app-button-' + (data.confirmColor ?? 'primary')" (click)="onConfirm()">
        {{ data.confirmLabel ? data.confirmLabel : 'Ok' }}
    </button>
</mat-dialog-actions>

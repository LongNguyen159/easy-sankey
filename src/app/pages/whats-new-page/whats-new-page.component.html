<div class="flex flex-col">
    <app-navbar [showLogo]="false" [showAddInput]="false" [showBackButton]="false" class="navbar"></app-navbar>

    <h1 class="px-6 py-10 text-center text-4xl font-bold">What's New in Easy Sankey</h1>

    <main class="page-container">
        <app-release-features [features]="features"></app-release-features>

        <mat-card class="flex w-full max-w-310 flex-col items-center gap-6 rounded-[28px]! px-6 py-12 text-center">
            <h2 class="text-3xl font-bold">Enjoy the new features!</h2>
            <button mat-flat-button [routerLink]="RoutePath.MainPage" (click)="uiService.scrollToTop()">
                Get Started
            </button>
        </mat-card>
    </main>
</div>

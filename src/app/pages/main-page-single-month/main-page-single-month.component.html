<div class="flex flex-col gap-8">
    <section>
        <div class="flex justify-end">
            <button mat-button type="button" (click)="isSankeyVertical.set(!isSankeyVertical())">
                <mat-icon fontSet="material-symbols-outlined">{{ isSankeyVertical() ? 'swap_horiz' : 'swap_vert' }}</mat-icon>
                {{ isSankeyVertical() ? 'Horizontal View' : 'Vertical View' }}
            </button>
        </div>
        <app-sankey-chart
            [sankeyData]="chartData.sankeyData"
            [remainingBalance]="chartData.remainingBalance"
            [savings]="chartData.savings"
            [surplusAfterBudgets]="chartData.surplusAfterBudgets"
            [surplusAtBudgetLimits]="chartData.surplusAtBudgetLimits"
            [totalBudgetOverspending]="chartData.totalBudgetOverspending"
            [orientation]="isSankeyVertical() ? 'vertical' : 'horizontal'"
            [highlightedCategoryId]="highlightedCategoryId"
            [showTooltip]="false"
            [allowInteractiveEdit]="false"
            [showInsights]="false"
        ></app-sankey-chart>
    </section>
    <!-- NETTO CHART -->
    <section>
        <app-pie-chart [treeMapData]="treeMapData" [showBreakdown]="true" [regularExpenseTree]="chartData.regularExpenseTree" [pieChartData]="pieChartDataNetto" [chartTitle]="'Net Income Distribution'"
            [totalIncome]="totalNetIncome" [totalExpenses]="totalExpenses"
        ></app-pie-chart>
    </section>

    @if (showGrossIncomePieChart) {
        <mat-divider [ngClass]="colorService.isDarkMode() ? 'border-gray-700!' : 'border-gray-300!'"></mat-divider>
        <!-- BRUTTO CHART -->
        <app-pie-chart [treeMapData]="treeMapData" [pieChartData]="pieChartDataBrutto" [chartTitle]="'Total Income Distribution'"
            [totalIncome]="totalGrossIncome"
        ></app-pie-chart>
    }
</div>

name: Build Electron App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2025
            command: node scripts/build.cjs && npx electron-builder --win --x64 --publish never
            platform: win32
            arch: x64
            extension: exe
            executable: win-unpacked/Easy Sankey.exe
          - target: mac-arm64
            runner: macos-15
            command: npm run deploy-mac -- --arm64 --publish never
            platform: darwin
            arch: arm64
            extension: dmg
            executable: mac-arm64/Easy Sankey.app/Contents/MacOS/Easy Sankey
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify native SQLite and browser tests
        run: npm test

      - name: Read package version
        id: package
        shell: bash
        run: node -p '"version=" + require("./package.json").version' >> "$GITHUB_OUTPUT"

      - name: Build and package the app
        run: ${{ matrix.command }}

      - name: Verify packaged SQLite and restart persistence
        run: node scripts/smoke-packaged.cjs "releases/v${{ steps.package.outputs.version }}/${{ matrix.platform }}/${{ matrix.arch }}/${{ matrix.executable }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: EasySankey-Build-${{ matrix.target }}
          retention-days: 7
          path: |
            releases/v${{ steps.package.outputs.version }}/${{ matrix.platform }}/${{ matrix.arch }}/*.${{ matrix.extension }}
            releases/v${{ steps.package.outputs.version }}/${{ matrix.platform }}/${{ matrix.arch }}/*.blockmap
            releases/v${{ steps.package.outputs.version }}/${{ matrix.platform }}/${{ matrix.arch }}/latest*.yml
          if-no-files-found: error
          overwrite: true
